load:
- type: '2014'
  path: ~/data/crohme/CROHME2014_data/TestEM2014GT/
  glob: '*.inkml'
- type: '2016'
  path: ~/data/crohme/CROHME2016_data/TEST2016_INKML_GT/
  glob: '*.inkml'
- type: '2019'
  path: ~/data/crohme/CROHME2019_data/Task1_onlineRec/MainTask_formula/Test2019_GT/
  glob: '*.inkml'
- type: '2023'
  path: ~/data/crohme/TC11_CROHME23/INKML/test/CROHME2023_test/
  glob: '*.inkml'
dump:
  path: ~/data/pickle/gryph_crohme_test.pkl
word: '\\(?:mathbb{\w}|begin{\w+}|end{\w+}|operatorname\*|[a-zA-Z]+|.)|.'
